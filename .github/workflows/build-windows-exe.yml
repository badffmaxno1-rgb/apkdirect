name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name APKDirect apkdirect_desktop.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKDirect-windows-exe
          path: dist/APKDirect.exe
